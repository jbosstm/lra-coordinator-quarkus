# native
quarkus.native.additional-build-args=-H:ReflectionConfigurationFiles=reflection-config.json

quarkus.ssl.native=true

# allow Swagger in prod mode
quarkus.swagger-ui.always-include=true

quarkus.http.cors.enabled=true

# ---- LRA JWT security (opt-in; default behavior is unchanged / open) ----
# Inbound auth: protect all coordinator endpoints. policy 'permit' = open (default).
# Enforce with -Dlra.auth.policy=authenticated (or env LRA_AUTH_POLICY=authenticated).
quarkus.http.auth.permission.lra.paths=/lra-coordinator,/lra-coordinator/*
quarkus.http.auth.permission.lra.policy=${lra.auth.policy:permit}
#
# When enforcing, also supply JWT verification (static PEM file/classpath resource,
# or a JWKS/OIDC certs URL), plus the expected issuer:
#   -Dmp.jwt.verify.publickey.location=...   (or env MP_JWT_VERIFY_PUBLICKEY_LOCATION)
#   -Dmp.jwt.verify.issuer=...               (or env MP_JWT_VERIFY_ISSUER)
#
# Outbound propagation of the Bearer token on coordinator -> participant callbacks
# (enable by registering the callback filter from lra-coordinator-jar):
#   -Dlra.http-client.providers=io.narayana.lra.coordinator.security.JwtTokenCallbackRequestFilter
#
# Recovery thread service token (the recovery thread has no request context, so it needs a
# pre-provisioned token). Enable by setting the location; refresh-seconds defaults to 300:
#   -Dlra.security.service-token.location=/var/run/secrets/lra/token
#   -Dlra.security.service-token.refresh-seconds=300

# containers
quarkus.container-image.registry=quay.io
quarkus.container-image.group=jbosstm
quarkus.container-image.name=lra-coordinator
quarkus.container-image.additional-tags=latest

# jandex
quarkus.index-dependency.microprofile-lra-api.group-id=org.eclipse.microprofile.lra
quarkus.index-dependency.microprofile-lra-api.artifact-id=microprofile-lra-api

quarkus.index-dependency.lra-service-base.group-id=org.jboss.narayana.lra
quarkus.index-dependency.lra-service-base.artifact-id=lra-service-base

# OpenTelemetry
quarkus.otel.service.name=lra-coordinator
quarkus.otel.traces.enabled=true
quarkus.otel.metrics.enabled=true
quarkus.otel.logs.enabled=true

# Metrics endpoint
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.jvm.enabled=true
